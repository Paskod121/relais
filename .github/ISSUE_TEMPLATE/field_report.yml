name: Field report / Rapport de terrain
description: Share real numbers from a class, bootcamp or hackathon. This is how the project decides what to build. / Partage des chiffres réels d'une séance.
title: "Field report: "
labels: ["field report"]
body:
  - type: markdown
    attributes:
      value: |
        Real measurements are the most valuable contribution right now.
        Les mesures réelles sont la contribution la plus utile en ce moment.
  - type: input
    id: place
    attributes:
      label: City and country / Ville et pays
      placeholder: Lomé, Togo
    validations:
      required: true
  - type: dropdown
    id: context
    attributes:
      label: Context / Contexte
      options:
        - University course / Cours universitaire
        - Bootcamp or community training / Formation communautaire
        - Hackathon or workshop / Hackathon ou atelier
        - Company team / Équipe en entreprise
        - Other / Autre
    validations:
      required: true
  - type: input
    id: people
    attributes:
      label: Number of machines / Nombre de machines
    validations:
      required: true
  - type: input
    id: stack
    attributes:
      label: What was installed / Ce qui a été installé
      placeholder: create-next-app, Vite + React, Express...
  - type: input
    id: size
    attributes:
      label: Download size per machine, in MB / Taille téléchargée par machine, en Mo
      description: Optional. Run "du -sh ~/.npm/_cacache" before and after on an empty cache, or estimate.
  - type: input
    id: price
    attributes:
      label: Price of 1 GB of data and currency / Prix d'1 Go et devise
      placeholder: 540 XOF
  - type: dropdown
    id: network
    attributes:
      label: How people were connected / Comment les gens étaient connectés
      multiple: true
      options:
        - Their own mobile data / Leur propre data mobile
        - A shared phone hotspot / Un partage de connexion
        - Campus or venue Wi-Fi / Wi-Fi du lieu
        - Other / Autre
  - type: textarea
    id: story
    attributes:
      label: What went wrong or slowed you down / Ce qui a bloqué ou ralenti
