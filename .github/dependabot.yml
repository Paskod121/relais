version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: daily
    # Same rule relais applies to others: no release younger than 3 days.
    cooldown:
      default-days: 3
    groups:
      dev-tools:
        patterns: ["*"]
    commit-message:
      prefix: "chore(deps)"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci(deps)"
